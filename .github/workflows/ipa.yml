# Builds crate as an unsigned IPA (Scripts/build-ipa.sh), attested once this
# repository is public: run by hand, as a workflow artifact; on a version tag
# (vX.Y), as a release. Install it with Scripts/sign-ipa.sh, which signs it
# with this team's certificate and profiles, or sign it with any other.
#
# The libraries come prebuilt and pinned, as Scripts/fetch-*.sh get them on a
# Mac: the frameworks release of this repository, and StikJIT's and crate's own
# releases.
name: ipa
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oneamendez/crate
          ref: v0.1.1
          path: crate-src
      - name: Check the tag is the app's version
        if: github.ref_type == 'tag'
        run: |
          versions=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' project.yml | sort -u)
          [ "$GITHUB_REF_NAME" = "v$versions" ] || {
              echo "tag $GITHUB_REF_NAME, but project.yml says $versions" >&2; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen meson pkg-config
      - name: Cache iOS 16 frameworks and build sources
        uses: actions/cache@v4
        with:
          path: |
            Frameworks/
            .deps/src/
            crate-src/target/
          key: ios16-frameworks-${{ hashFiles('Scripts/build-idevice.sh', 'Scripts/build-slirp.sh', 'Scripts/build-crate.sh') }}-${{ github.ref }}
          restore-keys: |
            ios16-frameworks-${{ hashFiles('Scripts/build-idevice.sh', 'Scripts/build-slirp.sh', 'Scripts/build-crate.sh') }}-
      - name: Frameworks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Scripts/build-idevice.sh
          Scripts/build-slirp.sh
          CRATE_DIR="$GITHUB_WORKSPACE/crate-src" Scripts/build-crate.sh
      - name: Build
        run: |
          Scripts/build-ipa.sh "$RUNNER_TEMP/out/crate-8plus.ipa"
          cd "$RUNNER_TEMP/out"
          shasum -a 256 crate-8plus.ipa | tee crate-8plus.ipa.sha256
      # What the app and its helper say they are, not what project.yml says:
      # v0.1.1 shipped calling itself 0.1, as its plists named a version of
      # their own.
      - name: Check the IPA is the app's version
        working-directory: ${{ runner.temp }}/out
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/project.yml" | sort -u)
          build=$(sed -n 's/^ *CURRENT_PROJECT_VERSION: "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/project.yml" | sort -u)
          mkdir check && unzip -q crate-8plus.ipa -d check
          plist=check/Payload/Crate.app/Info.plist
          got="$(plutil -extract CFBundleShortVersionString raw -o - "$plist") ($(plutil -extract CFBundleVersion raw -o - "$plist"))"
          [ "$got" = "$version ($build)" ] || {
              echo "${plist#check/} says $got, but project.yml says $version ($build)" >&2; exit 1; }
          minimum="$(plutil -extract MinimumOSVersion raw -o - check/Payload/Crate.app/Info.plist)"
          [ "$minimum" = "16.0" ] || {
              echo "Crate.app MinimumOSVersion is $minimum, expected 16.0" >&2; exit 1; }
          lipo -archs check/Payload/Crate.app/Crate | grep -qw arm64 || {
              echo "Crate.app does not contain arm64" >&2; exit 1; }
          rm -rf check
      # Attestations are free on a public repository only.
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/out/crate-8plus.ipa
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: crate-8plus
          path: |
            ${{ runner.temp }}/out/crate-8plus.ipa
            ${{ runner.temp }}/out/crate-8plus.ipa.sha256
      - name: Release
        if: github.ref_type == 'tag'
        working-directory: ${{ runner.temp }}/out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One line a paragraph: GitHub shows every newline in release notes.
          cat > notes.md <<EOF
          crate $GITHUB_REF_NAME for iPhone and iPad, unsigned: sign it with your own Apple account, then install it. [INSTALL.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/INSTALL.md) has the steps, and a request to paste into Claude Code, which does them for you.

          Built from $GITHUB_SHA with crate $(cat "$GITHUB_WORKSPACE/Frameworks/Crate.version"), rebuilt for iOS 16.

              SHA-256 $(cut -d' ' -f1 crate-8plus.ipa.sha256)
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "crate $GITHUB_REF_NAME" --notes-file notes.md \
              crate-8plus.ipa crate-8plus.ipa.sha256
